name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  verify:
    name: Verify release source
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Run static, unit, integration, and production-build checks
        run: npm run verify
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run primary renderer workflow
        run: npm run test:e2e
      - name: Run real Electron IPC smoke test
        run: xvfb-run -a npm run test:electron

  build:
    name: Package ${{ matrix.label }}
    needs: verify
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows x64
            command: npx electron-builder --win nsis --x64 --publish never
            pattern: release/*.exe
            artifact: savepoint-windows-x64
          - os: macos-latest
            label: macOS universal
            command: npx electron-builder --mac dmg --universal --publish never
            pattern: release/*.dmg
            artifact: savepoint-macos-universal
          - os: ubuntu-latest
            label: Linux x64
            command: npx electron-builder --linux AppImage deb --x64 --publish never
            pattern: |
              release/*.AppImage
              release/*.deb
            artifact: savepoint-linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches package version
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Build application
        run: npm run build
      - name: Package unsigned artifacts
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload platform artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Download packaged artifacts
        uses: actions/download-artifact@v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: find . -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" \
              --title "SavePoint ${GITHUB_REF_NAME}" \
              --notes-file .github/RELEASE_NOTES.md
            gh release upload "${GITHUB_REF_NAME}" artifacts/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" artifacts/* \
              --verify-tag \
              --title "SavePoint ${GITHUB_REF_NAME}" \
              --notes-file .github/RELEASE_NOTES.md
          fi
